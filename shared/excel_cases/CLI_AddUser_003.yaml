用例_编号: CLI_AddUser_003
用例_名称: CLI添加用户并验证
测试类型: 功能测试
优先级: P1
预置条件: |
  1. BMC SSH接口可达（端口22）
  2. SSH认证正常（Administrator / Admin@90000）
  3. 当前用户数未达上限
测试步骤: |
  1. 查看当前用户列表
  2. 通过CLI命令添加新用户 test_user
  3. 设置新用户权限为Administrator
  4. 启用新用户
  5. 查询用户列表确认新用户存在
  6. 删除测试用户
  7. 再次查询确认用户已删除
预期结果: |
  1) 用户列表查询成功
  2) 新用户 test_user 创建成功
  3) 权限设置成功
  4) 用户启用成功
  5) 用户列表包含 test_user
  6) 删除成功
  7) 用户列表不再包含 test_user
notes: CLI用户管理完整流程测试，注意环境恢复
