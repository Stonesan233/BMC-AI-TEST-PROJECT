# openUBMC AI 测试框架 - 配置文件

# Agent 模型配置
agents:
  exec:
    base_url: "https://api.minimax.chat/v1"
    api_key: "${MINIMAX_API_KEY}"
    model: "MiniMax-M2.5"
    temperature: 0.1
    max_tokens: 8192
  judge:
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    api_key: "${GLM_API_KEY}"
    model: "glm-5"
    temperature: 0.1
    max_tokens: 8192

# 运行参数
agent:
  exec_batch_size: 1   # Exec Agent 批量大小 (1~3)
  judge_batch_size: 1   # Judge Agent 批量大小 (固定为 1)

# RAG 检索模块配置
rag:
  enabled: true                          # 全局开关: 是否启用 RAG 命令检索

  # -- 向量存储 --
  chroma_path: "./shared/rag_index"      # Chroma 持久化目录
  collection_name: "openubmc_rag"        # Collection 名称

  # -- 混合检索参数 --
  alpha: 0.7                             # 向量检索权重 (0.0~1.0), BM25 权重 = 1 - alpha
  top_k: 3                               # 返回结果数量 (建议 3~5)

  # -- Query Rewriting --
  enable_rewrite: true                   # 是否启用查询改写
  rewrite_model: "qwen3.5-plus"          # 改写使用的模型 (DashScope 兼容 API)
  rewrite_weight: 2.0                    # 原始查询在 RRF 融合中的权重倍数 (改写查询为 1.0)
  rewrite_top_k: 5                       # Query Rewriter 生成的扩展查询条数

  # -- Embedding --
  embedding_api_key: "${DASHSCOPE_API_KEY}"
  embedding_base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  embedding_model: "text-embedding-v4"
  embedding_dimension: 1024

  # -- Rerank (预留, 暂未实现) --
  rerank_enabled: false                  # 是否启用 Rerank 二次排序
  # rerank_model: "gte-rerank-v2"        # Rerank 模型

# 目标 BMC 配置
# QEMU 跑在 WSL(172.23.17.208) 里，TCP 端口转发到 Windows 127.0.0.1
# IPMI(UDP) 只能从 WSL 网段访问，Redfish/SSH(TCP) 转发到 127.0.0.1
target:
  bmc_host: "127.0.0.1"           # Redfish / SSH
  bmc_port: 10443
  ipmi_host: "172.23.17.208"      # IPMI (UDP, WSL 网段)
  ipmi_port: 10623
  ssh_host: "127.0.0.1"           # SSH (TCP, 转发到 Windows)
  ssh_port: 10022
  bmc_user: "Administrator"
  bmc_password: "Admin@90000"
  # os_host: "192.168.1.101"    # 可选：主机控制台
  # os_user: "root"
  # os_password: "your_password"

# 存储配置
storage:
  shared_dir: "./shared"

# 日志配置
logging:
  level: "INFO"
  file: "./logs/test_framework.log"
