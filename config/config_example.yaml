# ======================================================================
# openUBMC AI 测试框架 - 统一配置文件
#
# 设计原则:
#   1. 所有 LLM / Embedding 服务统一为 providers，支持任意 OpenAI-compatible API
#   2. 每个组件（Exec / Judge / Embedding / Rewrite）独立选择 provider + model
#   3. API Key 支持 ${ENV_VAR} 引用或直接填写
#   4. 内网私有部署友好，运维人员只需修改 providers 和 models 即可
# ======================================================================


# ----- 1. 服务提供者（可定义多个，按需引用） -----
# 每个 provider 只需要 base_url 和 api_key，其余走 OpenAI 兼容协议
providers:

  # 默认服务（示例占位符，部署时替换为实际地址）
  default:
    base_url: "https://your-openai-service/api/v1/"
    api_key: "${YOUR_API_KEY}"             # 推荐: 环境变量引用
    timeout: 120.0                         # HTTP 超时（秒）

  # 第二个服务（可选，如需 Exec / Judge 分用不同后端）
  # secondary:
  #   base_url: "https://another-service/api/v1/"
  #   api_key: "${ANOTHER_API_KEY}"
  #   timeout: 120.0


# ----- 2. 组件模型配置（每个组件独立指定 provider + model） -----
models:

  # Test_Exec Agent（测试执行引擎）
  exec:
    provider: "default"                    # 引用 providers 中的名称
    model: "MiniMax-M2.5"                  # 模型标识（由服务端决定）
    temperature: 0.1
    max_tokens: 8192

  # Test_Judge Agent（测试判断引擎）
  judge:
    provider: "default"
    model: "glm-5"
    temperature: 0.1
    max_tokens: 8192

  # Embedding（向量检索用）
  embedding:
    provider: "default"
    model: "text-embedding-v4"
    dimension: 1024                        # 向量维度

  # Query Rewriter（查询扩展）
  rewrite:
    provider: "default"
    model: "qwen3.5-plus"
    temperature: 0.3
    max_tokens: 256


# ----- 3. 运行参数 -----
agent:
  exec_batch_size: 1                       # Exec Agent 批量大小 (1~3)
  judge_batch_size: 1                      # Judge Agent 批量大小 (固定为 1)


# ----- 4. RAG 检索模块 -----
rag:
  enabled: true                            # 全局开关: 是否启用 RAG 命令检索

  # -- 向量存储 --
  chroma_path: "./shared/rag_index"        # Chroma 持久化目录
  collection_name: "openubmc_rag"          # Collection 名称

  # -- 混合检索参数 --
  alpha: 0.7                               # 向量检索权重 (0.0~1.0), BM25 权重 = 1 - alpha
  top_k: 3                                 # 返回结果数量 (建议 3~5)

  # -- 接口类型控制 (IPMI / Redfish) --
  default_interface: "auto"                # 默认接口类型: auto / ipmi / redfish / both
  auto_detect: true                        # auto 模式下是否启用关键词自动检测
                                          #   true:  根据查询关键词智能判断搜索 IPMI/Redfish
                                          #   false: auto 等同于 both, 始终搜索两种文档

  # -- Query Rewriting --
  enable_rewrite: true                     # 是否启用查询改写
  rewrite_weight: 2.0                      # 原始查询在 RRF 融合中的权重倍数 (改写查询为 1.0)
  rewrite_top_k: 5                         # Query Rewriter 生成的扩展查询条数

  # -- Rerank (预留, 暂未实现) --
  rerank_enabled: false                    # 是否启用 Rerank 二次排序
  # rerank_model: "gte-rerank-v2"         # Rerank 模型


# ----- 5. 目标 BMC 配置 -----
# QEMU 跑在 WSL(172.23.17.208) 里，TCP 端口转发到 Windows 127.0.0.1
# IPMI(UDP) 只能从 WSL 网段访问，Redfish/SSH(TCP) 转发到 127.0.0.1
target:
  bmc_host: "127.0.0.1"                   # Redfish / SSH
  bmc_port: 10443
  ipmi_host: "172.23.17.208"              # IPMI (UDP, WSL 网段)
  ipmi_port: 10623
  ssh_host: "127.0.0.1"                   # SSH (TCP, 转发到 Windows)
  ssh_port: 10022
  bmc_user: "Administrator"
  bmc_password: "Admin@90000"
  # os_host: "192.168.1.101"              # 可选: 主机控制台
  # os_user: "root"
  # os_password: "your_password"


# ----- 6. 存储配置 -----
storage:
  shared_dir: "./shared"


# ----- 7. 日志配置 -----
logging:
  level: "INFO"
  file: "./logs/test_framework.log"
