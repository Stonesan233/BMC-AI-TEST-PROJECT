# ======================================================================
# openUBMC AI 测试框架 - 配置文件模板
#
# 使用方法:
#   cp config/config_example.yaml config/config.yaml
#   然后修改 config.yaml 填入实际的服务地址和 API Key
#
# 设计原则:
#   1. 所有 LLM / Embedding 服务统一为 providers，支持任意 OpenAI-compatible API
#   2. 每个组件（Exec / Judge / Embedding / Rewrite）独立选择 provider + model
#   3. API Key 支持 ${ENV_VAR} 引用或直接填写
#   4. 内网私有部署友好，运维人员只需修改 providers 和 models 即可
# ======================================================================


# ----- 1. 服务提供者（可定义多个，按需引用） -----
#
# 每个 provider 包含:
#   base_url    - OpenAI 兼容 API 地址（必填）
#   api_key     - API 密钥，支持 ${ENV_VAR} 引用或直接填写（必填）
#   timeout     - HTTP 超时秒数（默认 120）
#   verify_ssl  - 是否验证 SSL 证书（默认 true，内网自签名证书设为 false）
#   models      - 该 provider 下可用的模型列表及参数（必填）
#
# models 下的每个模型包含:
#   temperature  - 采样温度，0.0~1.0（默认 0.1）
#   max_tokens   - 最大输出 token 数（默认 4096）
#   dimension    - 向量维度，仅 Embedding 模型需要
#
providers:

  # ---- 默认服务（占位示例，部署时替换为实际地址） ----
  default:
    base_url: "https://your-openai-service/api/v1/"
    api_key: "${YOUR_API_KEY}"             # 推荐: 环境变量引用
    timeout: 120.0                         # HTTP 超时（秒）
    # verify_ssl: false                    # 内网自签名证书环境取消注释

    models:
      MiniMax-M2.5:                        # Exec Agent 使用
        temperature: 0.1
        max_tokens: 8192
      glm-5:                               # Judge Agent 使用
        temperature: 0.1
        max_tokens: 8192
      text-embedding-v4:                   # Embedding 使用
        dimension: 1024                    # 向量维度（必须）
      qwen3.5-plus:                        # Query Rewriter 使用
        temperature: 0.3
        max_tokens: 256

  # ---- 第二个服务（可选，如需 Exec / Judge 分用不同后端） ----
  # secondary:
  #   base_url: "https://another-service/api/v1/"
  #   api_key: "${ANOTHER_API_KEY}"
  #   timeout: 120.0
  #   models:
  #     some-model:
  #       temperature: 0.1
  #       max_tokens: 4096

  # ---- 内网 Embedding 服务（独立部署 Embedding 模型时使用） ----
  # 使用方法:
  #   1. 取消下方注释，填入内网服务地址和 API Key
  #   2. 将 models.embedding.provider 改为 "embedding-internal"
  #   3. 运行 python -m src.rag.build_index --directory <docs> --rebuild
  #
  # embedding-internal:
  #   base_url: "https://your-embedding-server:8000/v1/"
  #   api_key: "${EMBEDDING_API_KEY}"
  #   timeout: 60.0
  #   verify_ssl: false                    # 内网自签名证书，跳过 SSL 验证
  #   models:
  #     bge-large-zh-v1.5:                    # 替换为内网实际模型名
  #       dimension: 1024                      # 必须与模型输出维度一致
  #     bge-m3:                                # 或使用多语言模型
  #       dimension: 1024


# ----- 2. 组件模型分配（每个组件指定使用哪个 provider 的哪个 model） -----
#
# 只需填写两项:
#   provider  - 引用上面 providers 中的名称
#   model     - 引用该 provider.models 中的模型名称
#
models:

  # Test_Exec Agent（测试执行引擎）
  exec:
    provider: "default"
    model: "MiniMax-M2.5"

  # Test_Judge Agent（测试判断引擎）
  judge:
    provider: "default"
    model: "glm-5"

  # Embedding（向量检索用）
  # 切换模型后必须重建向量库: python -m src.rag.build_index --directory <docs> --rebuild
  embedding:
    provider: "default"
    model: "text-embedding-v4"

  # Query Rewriter（查询扩展）
  rewrite:
    provider: "default"
    model: "qwen3.5-plus"


# ----- 3. Agent 运行参数 -----
agent:
  exec_batch_size: 1                       # Exec Agent 批量大小 (1~3)
  judge_batch_size: 1                      # Judge Agent 批量大小 (固定为 1)

  # -- 工具调用超时（基于实际耗时，替代旧的固定调用次数判断） --
  # BMC 测试中 IPMI/Redfish/SSH 命令可能耗时 30~300 秒，
  # 基于实际耗时的超时比固定调用次数更合理。
  tool_timeout_seconds: 600                # 单次工具调用超时（秒），默认 600 = 10 分钟
  max_tool_rounds: 50                      # LLM 对话最大轮次（安全上限，防止无限循环）


# ----- 4. RAG 检索模块 -----
rag:
  enabled: true                            # 全局开关: 是否启用 RAG 命令检索

  # -- 向量存储 --
  chroma_path: "./shared/rag_index"        # Chroma 持久化目录
  collection_name: "openubmc_rag"          # Collection 名称

  # -- 混合检索参数 --
  alpha: 0.7                               # 向量检索权重 (0.0~1.0), BM25 权重 = 1 - alpha
  top_k: 3                                 # 返回结果数量 (建议 3~5)

  # -- 接口类型控制 (IPMI / Redfish) --
  default_interface: "auto"                # 默认接口类型: auto / ipmi / redfish / both
  auto_detect: true                        # auto 模式下是否启用关键词自动检测
                                          #   true:  根据查询关键词智能判断搜索 IPMI/Redfish
                                          #   false: auto 等同于 both, 始终搜索两种文档

  # -- Query Rewriting --
  enable_rewrite: true                     # 是否启用查询改写
  rewrite_weight: 2.0                      # 原始查询在 RRF 融合中的权重倍数 (改写查询为 1.0)
  rewrite_top_k: 5                         # Query Rewriter 生成的扩展查询条数

  # -- Rerank (预留, 暂未实现) --
  rerank_enabled: false                    # 是否启用 Rerank 二次排序
  # rerank_model: "gte-rerank-v2"         # Rerank 模型


# ----- 5. 目标 BMC 配置 -----
target:
  bmc_host: "127.0.0.1"                   # Redfish / SSH 地址
  bmc_port: 443                           # Redfish HTTPS 端口
  ipmi_host: "192.168.1.100"              # IPMI 地址（UDP，需直连网段）
  ipmi_port: 623                          # IPMI UDP 端口
  ssh_host: "127.0.0.1"                   # SSH 地址（BMC Shell）
  ssh_port: 22                            # SSH 端口（BMC Shell 默认 22，主机控制台 2200）
  bmc_user: "Administrator"               # BMC 登录用户名
  bmc_password: "your_password"           # BMC 登录密码
  verify_ssl: false                       # BMC 自签名证书环境建议设为 false
  # os_host: "192.168.1.101"              # 可选: 主机控制台地址
  # os_user: "root"                       # 可选: 主机控制台用户
  # os_password: "your_password"          # 可选: 主机控制台密码


# ----- 6. 存储配置 -----
storage:
  shared_dir: "./shared"                  # 共享数据目录


# ----- 7. 日志配置 -----
logging:
  level: "INFO"                            # 日志级别: DEBUG / INFO / WARNING / ERROR
  file: "./logs/test_framework.log"        # 日志文件路径
