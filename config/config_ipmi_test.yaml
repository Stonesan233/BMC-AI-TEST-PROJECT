# openUBMC AI 测试框架 - IPMI 集成测试配置

# Agent 配置（与主配置共用）
agents:
  exec:
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    api_key: "${GLM_API_KEY}"
    model: "glm-5"
    temperature: 0.1
    max_tokens: 8192
  judge:
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    api_key: "${GLM_API_KEY}"
    model: "glm-5"
    temperature: 0.1
    max_tokens: 8192

agent:
  exec_batch_size: 1
  judge_batch_size: 1
  rag:
    enabled: true
    knowledge_base_path: "./knowledge_base"

# IPMI 测试目标配置
target:
  bmc_host: "172.23.17.208"
  bmc_port: 10443
  ipmi_port: 10623
  bmc_user: "Administrator"
  bmc_password: "Admin@90000"

# 存储配置
storage:
  shared_dir: "./shared"

# 日志配置
logging:
  level: "INFO"
  file: "./logs/test_framework.log"
