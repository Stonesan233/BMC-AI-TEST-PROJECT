# openUBMC AI 测试框架 - IPMI/SSH 集成测试配置

# Agent 配置（MiniMax API）
agents:
  exec:
    base_url: "https://api.minimaxi.com/v1"
    api_key: "${MINIMAX_API_KEY}"
    model: "MiniMax-M2.7"
    temperature: 0.1
    max_tokens: 8192

agent:
  exec_batch_size: 1
  judge_batch_size: 1
  rag:
    enabled: true
    knowledge_base_path: "./knowledge_base"

# 目标 BMC 配置（QEMU 环境端口转发）
target:
  bmc_host: "172.23.17.208"
  bmc_port: 10443
  ipmi_port: 10623
  ssh_host: "127.0.0.1"
  ssh_port: 10022
  bmc_user: "Administrator"
  bmc_password: "Admin@90000"

# 存储配置
storage:
  shared_dir: "./shared"

# 日志配置
logging:
  level: "INFO"
  file: "./logs/test_framework.log"
